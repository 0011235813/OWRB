
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Oklahoma Reservoir Teacup Diagram</title>
  <style>
    body {
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }

    .dropdown {
      margin-bottom: 30px;
    }

    .diagram-container {
      position: relative;
      width: 300px;
      margin: 0 auto;
    }

    .teacup {
      width: 300px;
      height: 300px;
      background: #e0e0e0;
      border-bottom-left-radius: 50px;
      border-bottom-right-radius: 50px;
      border-top-left-radius: 150px;
      border-top-right-radius: 150px;
      overflow: hidden;
      position: relative;
      margin-bottom: 10px;
      border: 2px solid #999;
    }

    .fill {
      position: absolute;
      bottom: 0;
      width: 100%;
      background-color: #007bff;
    }

    .reservoir-name {
      font-weight: bold;
      margin: 10px 0;
      font-size: 20px;
    }

    .percent-full {
      font-size: 18px;
      margin-top: 5px;
    }

    .line {
      position: absolute;
      width: 100%;
      left: 0;
      text-align: left;
      font-size: 12px;
      padding-left: 5px;
    }

    .high {
      top: 10%;
      border-top: 2px dashed yellow;
      color: yellow;
    }

    .average {
      top: 50%;
      border-top: 2px solid red;
      color: red;
    }

    .low {
      top: 85%;
      border-top: 2px dashed yellow;
      color: yellow;
    }

    .legend {
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>Oklahoma Reservoir Storage</h1>

  <div class="dropdown">
    <label for="reservoir-select">Select Reservoir:</label>
    <select id="reservoir-select"></select>
  </div>

  <div class="diagram-container">
    <div class="teacup">
      <div class="fill" id="fill-level" style="height: 0%;"></div>
      <div class="line high">High</div>
      <div class="line average">Average</div>
      <div class="line low">Low</div>
    </div>
    <div class="reservoir-name" id="res-name">—</div>
    <div class="percent-full" id="percent-text">—</div>
  </div>

  <div class="legend">
    <span style="color: #007bff;">Blue</span> = Current Storage
  </div>

  <!-- Load PapaParse for CSV parsing -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    let reservoirData = {};

    // Load CSV file
    Papa.parse('reservoir_data.csv', {
      download: true,
      header: true,
      complete: function(results) {
        results.data.forEach(row => {
          const name = row['Reservoir'];
          const percent = parseFloat(row['PercentFull']);
          if (!isNaN(percent)) {
            reservoirData[name] = percent;
          }
        });

        // Populate dropdown
        const select = document.getElementById('reservoir-select');
        for (let name in reservoirData) {
          const option = document.createElement('option');
          option.value = name;
          option.textContent = name;
          select.appendChild(option);
        }

        // Set initial display
        if (select.options.length > 0) {
          select.value = select.options[0].value;
          updateDiagram(select.value);
        }

        // Set change handler
        select.addEventListener('change', function() {
          updateDiagram(this.value);
        });
      }
    });

    function updateDiagram(reservoirName) {
      const percent = reservoirData[reservoirName];
      document.getElementById('fill-level').style.height = `${percent}%`;
      document.getElementById('res-name').textContent = reservoirName;
      document.getElementById('percent-text').textContent = `${percent}% Full`;
    }
  </script>
</body>
</html>
