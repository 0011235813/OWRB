<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Broken Bow Lake Teacup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .title-text { text-align: center; font-size: 24px; font-weight: bold; margin-top: 10px; }
    .cup-wrapper { text-align: center; margin-top: 10px; }
    .cup-svg { width: 250px; height: auto; }
    .center-text { text-align: center; font-weight: bold; margin: 4px 0; }
    .legend { text-align: center; margin-top: 8px; font-size: 14px; }
    .legend .box { display: inline-block; width: 16px; height: 16px; vertical-align: middle; margin-right: 4px; }
  </style>
</head>
<body>
  <!-- Title -->
  <div class="title-text">Broken Bow Lake</div>

  <!-- SVG gauge exactly as in your Shiny code, with flat bottom -->
  <div class="cup-wrapper">
    <svg id="cupSvg" class="cup-svg" viewBox="0 0 300 240"
         preserveAspectRatio="xMidYMid meet"
         xmlns="http://www.w3.org/2000/svg">

      <defs>
        <clipPath id="cupClip">
          <path id="cupOutline"
                d="M0,20 L300,20 L187.5,200 L112.5,200 Z"/>
        </clipPath>
      </defs>

      <!-- water fill -->
      <rect id="waterRect"
            x="0" y="240" width="0" height="0"
            fill="#4A90E2"
            clip-path="url(#cupClip)"/>

      <!-- thresholds -->
      <line x1="0" x2="300" y1="56"  y2="56"  stroke="orange" stroke-dasharray="5,5" stroke-width="2"/>
      <text x="150" y="52" text-anchor="middle" font-size="14" fill="orange">High</text>
      <line x1="0" x2="300" y1="110" y2="110" stroke="red"   stroke-width="2"/>
      <text x="150" y="106" text-anchor="middle" font-size="14" fill="red">Average</text>
      <line x1="0" x2="300" y1="164" y2="164" stroke="orange" stroke-dasharray="5,5" stroke-width="2"/>
      <text x="150" y="160" text-anchor="middle" font-size="14" fill="orange">Low</text>

      <!-- outline -->
      <path d="M0,20 L300,20 L187.5,200 L112.5,200 Z"
            fill="none" stroke="#333" stroke-width="4"/>
    </svg>
  </div>

  <!-- Timestamp, percent, legend -->
  <div class="center-text" id="pct_timestamp">Loading…</div>
  <div class="center-text" id="pct_label">— of capacity</div>
  <div class="legend">
    <span class="box" style="background:#4A90E2;"></span>
    Blue = Current storage
  </div>

  <!-- Inline JS to mimic your Shiny logic -->
  <script>
    (function(){
      // 1. Define your percent full here (0–1)
      const pct = 0.68; 

      // 2. Update the SVG waterRect exactly as your Shiny JS handler
      const outline = document.getElementById('cupOutline');
      const water = document.getElementById('waterRect');
      const bb = outline.getBBox();
      const fillH = bb.height * pct;
      water.setAttribute('x', bb.x);
      water.setAttribute('width', bb.width);
      water.setAttribute('y', bb.y + bb.height - fillH);
      water.setAttribute('height', fillH);

      // 3. Update timestamp & percent text
      const now = new Date();
      const stamp = now.getFullYear() + '-' +
                    String(now.getMonth()+1).padStart(2,'0') + '-' +
                    String(now.getDate()).padStart(2,'0') + ' ' +
                    String(now.getHours()).padStart(2,'0') + ':' +
                    String(now.getMinutes()).padStart(2,'0') + ':' +
                    String(now.getSeconds()).padStart(2,'0');
      document.getElementById('pct_timestamp').textContent = 'As of ' + stamp;
      document.getElementById('pct_label').textContent = Math.round(pct*1000)/10 + '% of capacity';
    })();
  </script>
</body>
</html>
